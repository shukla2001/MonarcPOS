version: '3.8'

services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:15-alpine
    container_name: monarc_pos_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: monarc_pos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monarc_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Node.js Express & Prisma API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monarc_pos_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/monarc_pos?schema=public"
      PORT: 5000
      JWT_SECRET: "monarc_royal_ice_cream_super_secret_jwt_key_2026_987654321"
      NODE_ENV: "production"
    ports:
      - "5000:5000"

  # React Vite Frontend & Kiosk (Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: monarc_pos_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
